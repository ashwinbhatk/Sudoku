[package]
name = "sudoku"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[features]
default = ["slint-ui"]
slint-ui = ["dep:slint"]

[dependencies]
slint = { version = "1.17.1", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[build-dependencies]
slint-build = "1.17.1"
